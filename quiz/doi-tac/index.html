<!DOCTYPE html>
<!-- Bài kiểm tra đối tác MMH (NPP, đại lý) — cách chơi giống Kahoot: nhập thông tin + SĐT trước, 10 câu, mỗi câu 20 giây, điểm theo tốc độ, bảng xếp hạng.
     Máy chủ: kho riêng tư mmh-backend ▸ backends/survey/MMH_PartnerQuiz.gs (pqMeta / pqStart / pqAnswer / pqBoard), câu hỏi ở MMH_PartnerQuizBank.gs.
     Link làm bài (mã QR cuối video đào tạo): quiz/doi-tac/?b=nha-khoa-1 · ?b=nha-khoa-2 · màn xếp hạng chiếu TV: thêm &v=board
     Bảng xếp hạng chung (17/11/2026, cả 2 phần + tổng điểm, ai có link đều xem): quiz/doi-tac/?v=top (máy chủ pqBoardAll) -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài kiểm tra · MANI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../../media/app/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#22384F; --ink:#2C3A48; --mut:#5F7186; --line:#DDE3EA; --soft:#F3F5F8; --yel:#FFE100; --ok:#2E7D4F; --bad:#B3261E; --fld:#C3CDD8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#fff; color:var(--ink); font:16px/1.5 "Be Vietnam Pro", Aptos, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:16px 16px 40px; }
  .hd { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .hd img { height:34px; display:block; }
  .hd .lb { font-size:12px; color:var(--mut); text-align:right; line-height:1.35; }
  h1 { font-size:24px; line-height:1.25; color:var(--navy); margin:18px 0 4px; text-transform:uppercase; letter-spacing:.2px; font-weight:800; }
  .sub { color:var(--mut); margin:0 0 16px; }
  .rules { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 0 18px; }
  .rules div { background:var(--soft); border-radius:10px; padding:10px 10px 9px; }
  .rules b { display:block; font-size:22px; color:var(--navy); line-height:1.15; }
  .rules span { font-size:12px; color:var(--mut); }
  .rules div:first-child { background:var(--navy); } .rules div:first-child b, .rules div:first-child span { color:#fff; }
  label.f { display:block; font-weight:600; margin:14px 0 6px; color:var(--navy); font-size:15px; }
  label.f i { color:var(--bad); font-style:normal; }
  input[type=text], input[type=tel] { width:100%; padding:12px 13px; border:1px solid var(--fld); border-radius:10px; font:inherit; background:#fff; color:var(--ink); }
  input:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(34,56,79,.12); }
  .agree { display:flex; gap:10px; align-items:flex-start; margin:16px 0 4px; font-size:13.5px; color:var(--mut); }
  .agree input { width:20px; height:20px; margin-top:1px; accent-color:var(--navy); flex:none; }
  .btn { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:10px; padding:13px 22px; font:inherit; font-weight:700; cursor:pointer; background:var(--navy); color:#fff; }
  .btn.w { width:100%; margin-top:14px; font-size:17px; padding:15px; }
  .btn.sec { background:#fff; color:var(--navy); border:1px solid var(--fld); }
  .btn[disabled] { opacity:.5; cursor:default; }
  .err { color:var(--bad); min-height:1.3em; margin-top:8px; font-size:14px; }
  .hide { display:none !important; }

  .prz { display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:0 0 16px; font-size:14.5px; }
  .prz img { width:54px; height:54px; object-fit:cover; border-radius:8px; flex:none; }
  .prz b { color:var(--navy); }
  .fbk { margin-top:22px; border-top:1px solid var(--line); padding-top:4px; }
  .fbk textarea { width:100%; min-height:96px; padding:12px 13px; border:1px solid var(--fld); border-radius:10px; font:inherit; resize:vertical; color:var(--ink); }
  .fbk textarea:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(34,56,79,.12); }
  .fbk .ok { color:var(--ok); font-weight:600; margin-top:8px; }

  /* làm bài */
  .top { display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px; font-weight:600; color:var(--mut); font-size:14px; }
  .top b { color:var(--navy); font-size:18px; font-variant-numeric:tabular-nums; }
  .ring { position:relative; width:84px; height:84px; margin:4px auto 6px; }
  .ring svg { transform:rotate(-90deg); }
  .ring .n { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; }
  .ring.warn .n { color:var(--bad); }
  .qt { font-size:21px; line-height:1.35; font-weight:700; color:var(--navy); text-align:center; margin:6px 4px 16px; min-height:2.7em; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .op { position:relative; border:0; border-radius:12px; padding:14px 12px 14px 50px; min-height:86px; text-align:left; font:inherit; font-weight:600; font-size:16px; line-height:1.3; cursor:pointer; transition:opacity .2s, transform .1s; }
  .op:active { transform:scale(.98); }
  .op .k { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
  .op.c0 { background:var(--navy); color:#fff; } .op.c0 .k { background:#fff; color:var(--navy); }
  .op.c1 { background:var(--mut); color:#fff; } .op.c1 .k { background:#fff; color:var(--mut); }
  .op.c2 { background:var(--yel); color:#1a1a1a; } .op.c2 .k { background:#1a1a1a; color:var(--yel); }
  .op.c3 { background:#E3E7EC; color:var(--ink); } .op.c3 .k { background:var(--ink); color:#fff; }
  .opts.done .op { cursor:default; opacity:.3; }
  .opts.done .op.right { opacity:1; box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--ok); }
  .opts.done .op.picked.wrong { opacity:.75; box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--bad); }
  .fb { margin-top:16px; border-radius:12px; padding:14px 16px; background:var(--soft); }
  .fb .r { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .fb .r b { font-size:20px; } .fb .ok { color:var(--ok); } .fb .no { color:var(--bad); }
  .fb .pts { font-size:20px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; }
  .fb p { margin:6px 0 0; color:var(--ink); font-size:15px; }
  .fb .bar { height:4px; background:var(--line); border-radius:2px; margin-top:12px; overflow:hidden; }
  .fb .bar i { display:block; height:100%; width:0; background:var(--navy); }
  .wait { text-align:center; color:var(--mut); font-size:14px; margin-top:12px; min-height:1.4em; }

  /* kết quả */
  .kpi { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
  .kpi div { background:var(--soft); border-radius:12px; padding:14px 12px; }
  .kpi div:first-child { background:var(--navy); } .kpi div:first-child b, .kpi div:first-child span { color:#fff; }
  .kpi b { display:block; font-size:28px; line-height:1.1; color:var(--navy); font-variant-numeric:tabular-nums; }
  .kpi span { font-size:13px; color:var(--mut); }
  .tag { display:inline-block; padding:5px 14px; border-radius:999px; font-weight:700; font-size:14px; }
  .tag.ok { background:#E6F2EA; color:var(--ok); } .tag.no { background:#FBEAEA; color:var(--bad); }
  .cap { font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; margin:20px 0 6px; }
  table.lb { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.lb td { padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.lb td.r { width:34px; font-weight:800; color:var(--navy); }
  table.lb td.s { text-align:right; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.lb td small { display:block; color:var(--mut); font-size:12.5px; }
  table.lb tr.me td { background:var(--soft); }
  .acts { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .acts .btn { flex:1; min-width:150px; }

  /* màn xếp hạng (TV) */
  body.board .wrap { max-width:1600px; padding:3vh 3vw; }
  body.board .hd img { height:56px; } body.board .hd .lb { font-size:16px; }
  .bd { display:grid; grid-template-columns:minmax(260px,1fr) 2fr; gap:3vw; align-items:start; }
  .bd h1 { font-size:clamp(26px,3vw,48px); margin-top:2vh; }
  .bd .qr { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; display:inline-block; margin-top:8px; }
  .bd .qr img, .bd .qr canvas { display:block; width:min(26vw,320px) !important; height:auto !important; }
  .bd .stat { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .bd .stat div { background:var(--soft); border-radius:12px; padding:12px; } .bd .stat div:first-child { background:var(--navy); }
  .bd .stat b { display:block; font-size:clamp(22px,2.4vw,40px); color:var(--navy); line-height:1.1; } .bd .stat div:first-child b, .bd .stat div:first-child span { color:#fff; }
  .bd .stat span { font-size:clamp(12px,1vw,16px); color:var(--mut); }
  .bd table.lb { font-size:clamp(16px,1.6vw,26px); } .bd table.lb td { padding:1.1vh 8px; } .bd table.lb td small { font-size:.65em; }
  .bd table.lb td.r { width:2.4em; }
  .bd .url { color:var(--mut); font-size:clamp(12px,1vw,16px); margin-top:8px; word-break:break-all; }
  @media (max-width:520px) {
    h1 { font-size:21px; } .rules { grid-template-columns:repeat(2,1fr); }
    .op { min-height:78px; font-size:15px; } .qt { font-size:19px; }
    .kpi b { font-size:24px; }
  }
  @media (max-width:900px) { .bd { grid-template-columns:1fr; } }

  /* bảng xếp hạng chung ?v=top */
  body.top .wrap { max-width:1500px; }
  .tp-tabs { display:flex; gap:6px; margin:4px 0 14px; overflow-x:auto; }
  .tp-tabs button { border:1px solid var(--fld); background:#fff; color:var(--navy); border-radius:999px; padding:8px 14px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tp-tabs button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .tp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start; }
  .tp-col { border:1px solid var(--line); border-radius:14px; padding:14px 14px 6px; }
  .tp-col h2 { margin:0; font-size:17px; color:var(--navy); line-height:1.3; }
  .tp-col .st { font-size:13px; color:var(--mut); margin:2px 0 8px; }
  .tp-col table.lb td.r span { display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center; background:var(--soft); }
  .tp-col table.lb tr.p1 td.r span { background:var(--yel); color:#1a1a1a; }
  .tp-col table.lb tr.p2 td.r span, .tp-col table.lb tr.p3 td.r span { background:var(--navy); color:#fff; }
  .gift { display:inline-block; font-size:11px; font-weight:700; color:var(--navy); background:#FFF6B3; border-radius:6px; padding:1px 6px; margin-top:3px; }
  .tp-note { color:var(--mut); font-size:13px; margin:12px 0 0; }
  @media (max-width:1100px) { .tp-grid { grid-template-columns:1fr; } .tp-grid .tp-col { display:none; } .tp-grid .tp-col.on { display:block; } }
  @media (min-width:1101px) { .tp-tabs { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><img src="mani.png" alt="MANI"><div class="lb">MANI Medical Hanoi<br>Đào tạo đối tác</div></div>

  <!-- 1. Thông tin + luật chơi -->
  <section id="vIntro" class="hide">
    <h1 id="ti">Bài kiểm tra</h1>
    <p class="sub" id="su"></p>
    <div class="rules">
      <div><b id="rN">10</b><span>câu hỏi</span></div>
      <div><b id="rT">20 giây</b><span>mỗi câu</span></div>
      <div><b id="rP">8/10</b><span>câu đúng là đạt</span></div>
      <div><b>1.000</b><span>điểm tối đa mỗi câu</span></div>
    </div>
    <p class="sub">Trả lời đúng và càng nhanh thì càng được nhiều điểm. Điểm và bảng xếp hạng hiện ngay trên màn hình.</p>
    <div class="prz hide" id="prz"><img src="tui-coi.jpg" alt="Túi cói MANI"><span id="przT"></span></div>
    <label class="f" for="fName">Họ và tên <i>*</i></label>
    <input type="text" id="fName" autocomplete="name" maxlength="60">
    <label class="f" for="fDealer">Tên đại lý / nhà phân phối <i>*</i></label>
    <input type="text" id="fDealer" autocomplete="organization" maxlength="80">
    <label class="f" for="fPhone">Số điện thoại <i>*</i></label>
    <input type="tel" id="fPhone" autocomplete="tel" inputmode="tel" maxlength="16" placeholder="0912 345 678">
    <label class="agree"><input type="checkbox" id="fAgree"><span>Tôi đồng ý cho Mani Medical Hanoi lưu thông tin trên để ghi nhận kết quả đào tạo và liên hệ khi cần.</span></label>
    <div class="err" id="e1"></div>
    <button class="btn w" id="bGo">Bắt đầu</button>
    <p class="sub" style="text-align:center;margin-top:14px"><a href="?v=top" style="color:var(--navy);font-weight:600">Xem bảng xếp hạng chung</a></p>
  </section>

  <!-- 2. Làm bài -->
  <section id="vPlay" class="hide">
    <div class="top"><span>Câu <b id="pI">1</b>/<span id="pN">10</span></span><span>Điểm <b id="pS">0</b></span></div>
    <div class="ring" id="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="37" fill="none" stroke="#DDE3EA" stroke-width="7"/><circle id="arc" cx="42" cy="42" r="37" fill="none" stroke="#22384F" stroke-width="7" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="0"/></svg><div class="n" id="tN">20</div></div>
    <div class="qt" id="qT"></div>
    <div class="opts" id="ops"></div>
    <div class="wait" id="wt"></div>
    <div class="fb hide" id="fb"></div>
  </section>

  <!-- 3. Kết quả -->
  <section id="vEnd" class="hide"></section>

  <!-- màn xếp hạng (TV) -->
  <section id="vBoard" class="hide"></section>

  <!-- bảng xếp hạng chung (?v=top) -->
  <section id="vTop" class="hide"></section>

  <div class="err" id="eG"></div>
</div>

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbx8l7u4j2tFDpfsg8IFsEcuXNrTbrLVRA_SoZ2Iisqprfm1ipL4z2NfDudVKuI1paFQPg/exec';
  var qs = new URLSearchParams(location.search), B = qs.get('b') || '', VIEW = qs.get('v') || '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (n) { return Number(n || 0).toLocaleString('vi-VN'); };
  var KEY = 'mmh_pq_info';
  var S = { meta: null, tk: '', q: null, n: 10, perQ: 20, score: 0, t0: 0, timer: 0, busy: false };

  function show(id) { ['vIntro', 'vPlay', 'vEnd', 'vBoard', 'vTop'].forEach(function (v) { $(v).classList.toggle('hide', v !== id); }); window.scrollTo(0, 0); }

  function call(action, body, tries) {
    tries = tries == null ? 3 : tries;
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, body || {})) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function (e) {
        if (tries > 1) return new Promise(function (ok) { setTimeout(ok, 900); }).then(function () { return call(action, body, tries - 1); });
        throw e;
      });
  }

  /* ---------- 1. thông tin ---------- */
  function intro() {
    var m = S.meta;
    document.title = m.title + ' · Bài kiểm tra';
    $('ti').textContent = m.title; $('su').textContent = m.sub;
    $('rN').textContent = m.n; $('rT').textContent = m.perQ + ' giây'; $('rP').textContent = m.pass + '/' + m.n;
    if (m.prize) { $('przT').innerHTML = 'Đúng từ <b>' + m.pass + '/' + m.n + ' câu</b> là đạt. <b>' + esc(m.prize) + '</b>.'; $('prz').classList.remove('hide'); }
    try { var o = JSON.parse(localStorage.getItem(KEY) || '{}'); if (o.name) $('fName').value = o.name; if (o.dealer) $('fDealer').value = o.dealer; if (o.phone) $('fPhone').value = o.phone; if (o.agree) $('fAgree').checked = true; } catch (x) {}
    show('vIntro');
  }
  $('bGo').onclick = function () {
    var info = { name: $('fName').value.trim(), dealer: $('fDealer').value.trim(), phone: $('fPhone').value.trim(), agree: $('fAgree').checked };
    var d = info.phone.replace(/\D/g, ''); if (/^84\d{9}$/.test(d)) d = '0' + d.slice(2);
    var err = info.name.length < 2 ? 'Vui lòng nhập họ và tên.' : info.dealer.length < 2 ? 'Vui lòng nhập tên đại lý / nhà phân phối.'
      : !/^0\d{9}$/.test(d) ? 'Số điện thoại chưa đúng (10 số, bắt đầu bằng 0).' : !info.agree ? 'Vui lòng tick ô đồng ý.' : '';
    $('e1').textContent = err; if (err) return;
    try { localStorage.setItem(KEY, JSON.stringify(info)); } catch (x) {}
    $('bGo').disabled = true; $('bGo').textContent = 'Đang chuẩn bị câu hỏi…';
    call('pqStart', { b: B, info: info }).then(function (r) {
      $('bGo').disabled = false; $('bGo').textContent = 'Bắt đầu';
      if (!r.ok) { $('e1').textContent = r.error || 'Chưa bắt đầu được, vui lòng thử lại.'; return; }
      S.tk = r.tk; S.n = r.n; S.perQ = r.perQ; S.score = 0;
      $('pN').textContent = r.n; $('pS').textContent = '0';
      show('vPlay'); ask(r.q);
    }).catch(function () { $('bGo').disabled = false; $('bGo').textContent = 'Bắt đầu'; $('e1').textContent = 'Mạng chậm hoặc mất kết nối, vui lòng bấm lại.'; });
  };

  /* ---------- 2. từng câu ---------- */
  function ask(q) {
    S.q = q; S.busy = false;
    $('pI').textContent = q.i + 1; $('qT').textContent = q.q; $('wt').textContent = ''; $('fb').classList.add('hide');
    var box = $('ops'); box.className = 'opts'; box.innerHTML = '';
    q.o.forEach(function (t, k) {
      var b = document.createElement('button'); b.className = 'op c' + k; b.innerHTML = '<span class="k">' + 'ABCD'.charAt(k) + '</span>' + esc(t);
      b.onclick = function () { answer(k, b); }; box.appendChild(b);
    });
    S.t0 = performance.now(); tick();
  }
  function tick() {
    clearTimeout(S.timer);
    var left = Math.max(0, S.perQ * 1000 - (performance.now() - S.t0)), sec = Math.ceil(left / 1000);
    $('tN').textContent = sec; $('ring').classList.toggle('warn', sec <= 5);
    $('arc').setAttribute('stroke-dashoffset', String(232.5 * (1 - left / (S.perQ * 1000))));
    $('arc').setAttribute('stroke', sec <= 5 ? '#B3261E' : '#22384F');
    if (left <= 0) { answer(-1, null); return; }
    S.timer = setTimeout(tick, 100);
  }
  function answer(k, el) {
    if (S.busy) return; S.busy = true; clearTimeout(S.timer);
    var ms = Math.round(performance.now() - S.t0), q = S.q;
    var box = $('ops'); box.classList.add('done');
    if (el) el.classList.add('picked');
    $('wt').textContent = k < 0 ? 'Hết giờ' : 'Đang chấm…';
    call('pqAnswer', { tk: S.tk, i: q.i, pick: k, ms: ms }, 4).then(function (r) {
      if (!r.ok) {
        if (r.code === 'ORDER' && r.q) { ask(r.q); return; }
        if (r.code === 'DONE' && r.fin) { end(r.fin); return; }
        $('wt').textContent = ''; $('eG').textContent = r.error || 'Có lỗi, vui lòng tải lại trang.'; return;
      }
      feedback(r);
    }).catch(function () { $('wt').textContent = ''; $('eG').innerHTML = 'Mất kết nối. <button class="btn sec" id="bRe">Gửi lại câu trả lời</button>'; $('bRe').onclick = function () { $('eG').textContent = ''; S.busy = false; answer(k, el); }; });
  }
  function feedback(r) {
    S.score = r.score; $('pS').textContent = fmt(r.score); $('wt').textContent = '';
    var ops = $('ops').children;
    for (var i = 0; i < ops.length; i++) { if (i === r.correct) ops[i].classList.add('right'); else if (ops[i].classList.contains('picked')) ops[i].classList.add('wrong'); }
    var head = r.right ? '<b class="ok">Đúng</b><span class="pts">+' + fmt(r.pts) + '</span>'
      : '<b class="no">' + (r.timeout ? 'Hết giờ' : 'Chưa đúng') + '</b><span class="pts">+0</span>';
    var fb = $('fb');
    fb.innerHTML = '<div class="r">' + head + '</div>' + (r.right ? '' : '<p><b>Đáp án đúng: ' + 'ABCD'.charAt(r.correct) + '.</b></p>') + '<p>' + esc(r.x) + '</p>'
      + '<div class="bar"><i id="fbi"></i></div>';
    fb.classList.remove('hide');
    var wait = r.wait || 3500, t0 = performance.now();
    (function run() {
      var p = Math.min(1, (performance.now() - t0) / wait); var bi = $('fbi'); if (bi) bi.style.width = (p * 100) + '%';
      if (p < 1) requestAnimationFrame(run); else if (r.next) ask(r.next); else if (r.fin) end(r.fin);
    })();
  }

  /* ---------- 3. kết quả ---------- */
  function lbRows(top, meRank) {
    if (!top || !top.length) return '<p class="sub">Chưa có ai trên bảng xếp hạng.</p>';
    return '<table class="lb">' + top.map(function (t) {
      return '<tr' + (t.rank === meRank ? ' class="me"' : '') + '><td class="r">' + t.rank + '</td><td>' + esc(t.name) + '<small>' + esc(t.dealer) + '</small></td><td class="s">' + fmt(t.score) + '<small>' + t.right + '/' + t.n + ' câu</small></td></tr>';
    }).join('') + '</table>';
  }
  function end(f) {
    clearTimeout(S.timer);
    $('vEnd').innerHTML = '<h1>Kết quả</h1><p class="sub">' + esc(S.meta.title) + '</p>'
      + '<span class="tag ' + (f.passed ? 'ok">Đạt' : 'no">Chưa đạt') + '</span>'
      + '<div class="kpi"><div><b>' + fmt(f.score) + '</b><span>điểm</span></div><div><b>' + f.nRight + '/' + f.n + '</b><span>câu đúng · đạt từ ' + f.pass + '</span></div>'
      + '<div><b>' + (f.rank || '-') + '<span style="font-size:15px;font-weight:600"> / ' + f.players + '</span></b><span>hạng hiện tại</span></div></div>'
      + (f.best > f.score ? '<p class="sub">Điểm cao nhất của bạn: ' + fmt(f.best) + '. Bảng xếp hạng tính lượt điểm cao nhất.</p>' : '')
      + '<div class="cap">Bảng xếp hạng · top 10</div>' + lbRows(f.top, f.rank)
      + (S.meta.prize ? '<p class="sub" style="margin-top:10px">' + esc(S.meta.prize) + '. Kết quả chốt khi kết thúc buổi đào tạo.</p>' : '')
      + '<div class="fbk"><label class="f" for="fFb">Góp ý thêm về sản phẩm MANI <span style="font-weight:400;color:var(--mut)">(không tính điểm)</span></label>'
      + '<textarea id="fFb" maxlength="1500" placeholder="Ví dụ: sản phẩm bác sĩ đang hỏi, cỡ / mã cần thêm, nhận xét khi sử dụng…"></textarea>'
      + '<div class="err" id="eFb"></div><button class="btn sec" id="bFb">Gửi góp ý</button></div>'
      + '<div class="acts"><button class="btn" id="bAgain">Làm lượt mới</button><button class="btn sec" id="bBoard">Bảng xếp hạng chung</button></div>';
    show('vEnd');
    $('bFb').onclick = function () {
      var t = $('fFb').value.trim(); if (t.length < 2) { $('eFb').textContent = 'Vui lòng nhập góp ý.'; return; }
      $('eFb').textContent = ''; $('bFb').disabled = true; $('bFb').textContent = 'Đang gửi…';
      call('pqFeedback', { tk: S.tk, text: t }).then(function (r) {
        if (!r.ok) { $('bFb').disabled = false; $('bFb').textContent = 'Gửi góp ý'; $('eFb').textContent = r.error || 'Chưa gửi được, vui lòng thử lại.'; return; }
        $('bFb').outerHTML = '<div class="ok">Cảm ơn anh/chị đã góp ý.</div>'; $('fFb').disabled = true;
      }).catch(function () { $('bFb').disabled = false; $('bFb').textContent = 'Gửi góp ý'; $('eFb').textContent = 'Mất kết nối, vui lòng bấm lại.'; });
    };
    $('bAgain').onclick = function () { intro(); };
    $('bBoard').onclick = function () { location.href = '?v=top'; };
  }

  /* ---------- màn xếp hạng (TV, tự cập nhật 5 giây) ---------- */
  function board() {
    document.body.classList.add('board');
    var link = location.origin + location.pathname + '?b=' + encodeURIComponent(B);
    $('vBoard').innerHTML = '<div class="bd"><div><h1 id="bT">' + esc(S.meta.title) + '</h1><p class="sub">Quét mã để làm bài kiểm tra · ' + S.meta.n + ' câu · ' + S.meta.perQ + ' giây mỗi câu</p>'
      + '<div class="qr" id="qr"></div><div class="url">' + esc(link) + '</div>'
      + (S.meta.prize ? '<div class="prz" style="margin-top:14px"><img src="tui-coi.jpg" alt=""><span>Đạt từ <b>' + S.meta.pass + '/' + S.meta.n + ' câu</b>. <b>' + esc(S.meta.prize) + '</b>.</span></div>' : '')
      + '<div class="stat"><div><b id="sP">0</b><span>người tham gia</span></div><div><b id="sA">0</b><span>lượt hôm nay</span></div><div><b id="sO">0</b><span>người đạt</span></div></div></div>'
      + '<div><div class="cap">Bảng xếp hạng · top 10</div><div id="bL"></div><div class="url" id="bU"></div></div></div>';
    show('vBoard');
    var qrDraw = function () {  // qrcode-generator 1.4.4 (Kazuhiko Arase, MIT) để cạnh trang — không phụ thuộc CDN
      try {
        var qr = qrcode(0, 'M'); qr.addData(link); qr.make();
        var n = qr.getModuleCount(), m = 4, d = '';
        for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
        $('qr').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * m) + ' ' + (n + 2 * m) + '" shape-rendering="crispEdges" style="display:block;width:min(26vw,320px);height:auto"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#22384F"/></svg>';
      } catch (x) { $('qr').classList.add('hide'); }
    };
    var sc = document.createElement('script'); sc.src = 'qrcode-generator.js'; sc.onload = qrDraw; sc.onerror = function () { $('qr').classList.add('hide'); }; document.head.appendChild(sc);
    var poll = function () {
      call('pqBoard', { b: B }, 1).then(function (r) {
        if (!r.ok) return;
        $('sP').textContent = fmt(r.players); $('sA').textContent = fmt(r.today); $('sO').textContent = fmt(r.passed);
        $('bL').innerHTML = lbRows(r.top, 0);
        $('bU').textContent = 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
      }).catch(function () {}).then(function () { setTimeout(poll, 5000); });
    };
    poll();
  }

  /* ---------- bảng xếp hạng chung: Phần 1 · Phần 2 · tổng điểm (tự cập nhật 10 giây) ---------- */
  function top() {
    document.body.classList.add('top');
    document.title = 'Bảng xếp hạng · Bài kiểm tra đối tác';
    var tab = 'all';
    $('vTop').innerHTML = '<h1>Bảng xếp hạng</h1><p class="sub">Bài kiểm tra đối tác · dụng cụ và vật liệu nha khoa MANI</p>'
      + '<div class="tp-tabs" id="tpTabs"></div><div class="tp-grid" id="tpGrid"><p class="sub">Đang tải…</p></div>'
      + '<p class="tp-note" id="tpNote"></p><div class="url" id="tpU" style="color:var(--mut);font-size:12px;margin-top:6px"></div>';
    show('vTop');
    var rowsPart = function (p) {
      if (!p.top.length) return '<p class="sub">Chưa có ai làm bài.</p>';
      return '<table class="lb">' + p.top.map(function (t) {
        var gift = t.rank <= 3 && t.right >= p.pass ? '<span class="gift">Túi cói MANI</span>' : '';
        return '<tr class="p' + t.rank + '"><td class="r"><span>' + t.rank + '</span></td><td>' + esc(t.name) + '<small>' + esc(t.dealer) + '</small>' + gift + '</td>'
          + '<td class="s">' + fmt(t.score) + '<small>' + t.right + '/' + t.n + ' câu</small></td></tr>';
      }).join('') + '</table>';
    };
    var rowsAll = function (r) {
      if (!r.overall.length) return '<p class="sub">Chưa có ai làm bài.</p>';
      var names = r.parts.map(function (p) { return String(p.sub || p.b).replace(/^Bài kiểm tra · /, ''); });
      return '<table class="lb">' + r.overall.slice(0, 10).map(function (t) {
        var det = t.sc.map(function (v, i) { return names[i] + ': ' + (v == null ? 'chưa làm' : fmt(v)); }).join(' · ');
        return '<tr class="p' + t.rank + '"><td class="r"><span>' + t.rank + '</span></td><td>' + esc(t.name) + '<small>' + esc(t.dealer) + '</small><small>' + det + '</small></td>'
          + '<td class="s">' + fmt(t.total) + '<small>tổng điểm</small></td></tr>';
      }).join('') + '</table>';
    };
    var paint = function (r) {
      var cols = [{ k: 'all', name: 'Tổng các phần', html: rowsAll(r), st: fmt(r.players) + ' người tham gia' }].concat(r.parts.map(function (p) {
        var nm = String(p.sub || p.b).replace(/^Bài kiểm tra · /, '');
        return { k: p.b, name: nm + ': ' + p.title, short: nm, html: rowsPart(p), st: fmt(p.players) + ' người · ' + fmt(p.passed) + ' người đạt · ' + fmt(p.attempts) + ' lượt' };
      }));
      $('tpTabs').innerHTML = cols.map(function (c) { return '<button data-k="' + c.k + '"' + (c.k === tab ? ' class="on"' : '') + '>' + esc(c.short || c.name) + '</button>'; }).join('');
      $('tpGrid').innerHTML = cols.map(function (c) {
        return '<div class="tp-col' + (c.k === tab ? ' on' : '') + '"><h2>' + esc(c.name) + '</h2><div class="st">' + c.st + '</div>' + c.html + '</div>';
      }).join('');
      Array.prototype.forEach.call($('tpTabs').querySelectorAll('button'), function (b) { b.onclick = function () { tab = b.getAttribute('data-k'); paint(r); }; });
      var p0 = r.parts[0] || {};
      $('tpNote').textContent = 'Mỗi người tính lượt điểm cao nhất của từng phần. Top 3 mỗi phần (đúng từ ' + (p0.pass || 6) + '/' + (p0.n || 10) + ' câu) nhận túi cói MANI.';
      $('tpU').textContent = 'Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN');
    };
    var last = null;
    var poll = function () {
      call('pqBoardAll', {}, 1).then(function (r) { if (r && r.ok) { last = r; paint(r); } else if (!last) $('tpGrid').innerHTML = '<p class="sub">Chưa tải được bảng xếp hạng.</p>'; })
        .catch(function () { if (!last) $('tpGrid').innerHTML = '<p class="sub">Không kết nối được máy chủ, đang thử lại…</p>'; })
        .then(function () { setTimeout(poll, 10000); });
    };
    poll();
  }

  /* ---------- khởi động ---------- */
  if (VIEW === 'top') { top(); return; }
  if (!B) { $('eG').textContent = 'Link bài kiểm tra thiếu mã bài. Vui lòng quét lại mã QR.'; return; }
  $('eG').textContent = 'Đang tải…';
  call('pqMeta', { b: B }).then(function (m) {
    $('eG').textContent = '';
    if (!m.ok) { $('eG').textContent = m.error || 'Link bài kiểm tra không đúng.'; return; }
    S.meta = m;
    if (VIEW === 'board') board(); else intro();
  }).catch(function () { $('eG').textContent = 'Không kết nối được máy chủ. Vui lòng kiểm tra mạng rồi tải lại trang.'; });
})();
</script>
</body>
</html>
