    box.innerHTML = '';
    st.rendered = {};
    st.pdf.getPage(1).then(p => {
      const vp = p.getViewport({scale: st.scale});
      for (let i = 1; i <= st.total; i++) {
        const d = document.createElement('div');
        d.className = 'rd-page'; d.dataset.p = i; d.style.width = vp.width + 'px'; d.style.height = Math.round(vp.width * st.ratio) + 'px';
        d.innerHTML = `<div class="ph">Trang ${i}</div>`;
        box.appendChild(d);
      }
      if (st.io) st.io.disconnect();
      if (st.vo) st.vo.disconnect();
      st.io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) this.renderPage(+en.target.dataset.p); }), {root: box, rootMargin: '800px 0px'});
      st.vo = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) this.setPage(+en.target.dataset.p); }), {root: box, threshold: 0.55});
      box.querySelectorAll('.rd-page').forEach(d => { st.io.observe(d); st.vo.observe(d); });
      if (st.page > 1) this.goto(st.page, true);
    });
  },
  async renderPage(n){
    const st = this.st; if (!st || !st.pdf || st.rendered[n]) return;
    st.rendered[n] = true;
    const page = await st.pdf.getPage(n);
    const vp = page.getViewport({scale: st.scale});
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
    c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
    const holder = document.querySelector(`.rd-page[data-p="${n}"]`); if (!holder) return;
    holder.style.height = vp.height + 'px';
    await page.render({canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null}).promise;
    holder.innerHTML = ''; holder.appendChild(c);
  },
  async renderThumb(n){
    const st = this.st; if (!st || !st.pdf) return;
    const page = await st.pdf.getPage(n);
    const cv = document.querySelector(`#th${n} canvas`); if (!cv) return;
    const vp = page.getViewport({scale: 120 / page.getViewport({scale: 1}).width});
    cv.width = vp.width; cv.height = vp.height;
    page.render({canvasContext: cv.getContext('2d'), viewport: vp});
  },
  setPage(n){
    const st = this.st; if (!st) return;
    st.page = n; $('rdPage').value = n;
    document.querySelectorAll('#rdThumbs .th').forEach(t => t.classList.toggle('on', +t.dataset.p === n));
    const th = $('th' + n); if (th && $('rdThumbs')) { const T = $('rdThumbs'); if (th.offsetTop < T.scrollTop || th.offsetTop > T.scrollTop + T.clientHeight - 80) T.scrollTop = th.offsetTop - 40; }
    if (n > st.maxPage) st.maxPage = n;
    if (st.course && !st.completed) { if (st.maxPage >= st.total) Course.complete(); else { const ft = $('crsFoot'); if (ft) ft.innerHTML = Course.foot(st.sid); } }
    this.bar(Math.round(st.maxPage / st.total * 100));
  },
  goto(n, instant){
    const st = this.st; if (!st) return;
    n = Math.max(1, Math.min(st.total, n));
    const d = document.querySelector(`.rd-page[data-p="${n}"]`);
    if (d) $('rdPages').scrollTo({top: d.offsetTop - 16, behavior: instant ? 'auto' : 'smooth'});
  },
  zoom(dir){ const st = this.st; if (!st || !st.pdf) return; st.scale = Math.max(0.4, Math.min(3, st.scale * (dir > 0 ? 1.2 : 1 / 1.2))); const p = st.page; this.layout(); st.page = p; },
  bar(p){ const b = $('rdBar'); if (b) b.style.width = p + '%'; },
  track(o){
    const st = this.st; if (!st) return;
    if (o.page) st.sent = Math.max(st.sent, o.page);
    const payload = Object.assign({sid: st.sid, fileId: st.f.id, fileName: st.f.name}, o);
    if (o.done) Progress.add(payload);
    post('trackProgress', payload, {retry: o.done ? 2 : 0, timeout: 30000})
      .then(r => { if (o.done) Progress.remove(payload); if (r.completed) { const pg = S.progress[st.sid] || (S.progress[st.sid] = {opened: 0, done: 0}); pg.opened++; pg.done++; } if (r.sessionDone) { const s0 = findS(st.sid); if (s0) s0.myStatus = 'Completed'; ok('Bạn đã hoàn thành buổi đào tạo này.'); reload(); } const m = S.mats[st.sid]; if (m) { m.myProgress = (m.myProgress || []).filter(x => x.fileId !== st.f.id).concat([{fileId: st.f.id, percent: r.percent, completed: r.completed || !!o.done}]); } })
      .catch(() => { if (o.done) toast('Chưa lưu được tiến độ học lên máy chủ — hệ thống sẽ tự gửi lại.'); });
  },
  beacon(){
    const st = this.st; if (!st || !st.total || st.done) return;
    try { const b = new URLSearchParams(); b.set('action', 'trackProgress'); b.set('token', S.token); b.set('payload', JSON.stringify({sid: st.sid, fileId: st.f.id, fileName: st.f.name, open: 1, page: st.maxPage, total: st.total})); navigator.sendBeacon(API_URL, b); st.done = true; } catch (e) {}
  },
  close(silent){
    const st = this.st;
    if (st && !silent && st.total && !st.done) { st.done = true; this.track({open: 1, page: st.maxPage, total: st.total}); }
    if (st && st.io) st.io.disconnect();
    if (st && st.vo) st.vo.disconnect();
    if (st && st.url) URL.revokeObjectURL(st.url);
    if (st && st.timer) clearInterval(st.timer);
    const wasCourse = st && st.course;
    $('reader').classList.remove('course');
    if (st && st.pdf) try { st.pdf.destroy(); } catch (e) {}
    this.st = null;
    $('reader').classList.remove('on'); $('reader').innerHTML = '';
    if (!$('qz').classList.contains('on')) document.body.style.overflow = '';
    if (!silent && S.route.name === 's') { if (wasCourse) SessionPage.render(); else SessionPage.renderTab(); }

  }
};

/* ==========================================================================
   ★ v2.3 — TỰ HỌC CÓ LỘ TRÌNH: Học tài liệu → Làm bài kiểm tra → Chứng chỉ
   Tài liệu PDF/Slide/Word: hoàn thành khi đọc tới trang cuối.
   Ảnh: hoàn thành khi mở. Video/định dạng Drive: bấm "Đã xem xong" sau 20 giây.
   ========================================================================== */
const Course = {
  files(sid){ const m = S.mats[sid]; return m && m.files ? m.files : []; },
  optional(sid){ const f = S.full[sid]; const g = f && f.quiz && f.quiz.gate; return new Set((g && g.optional) || []); },
  required(sid){ const f = S.full[sid]; return !!(f && f.quiz && f.quiz.requireMaterials); },
  done(sid, fid){ const m = S.mats[sid]; return !!(m && (m.myProgress || []).some(p => p.fileId === fid && p.completed)); },
  stats(sid){
    const opt = this.optional(sid), fs = this.files(sid);
    const req = fs.filter(f => !opt.has(f.id));
    const d = req.filter(f => this.done(sid, f.id)).length;
    return {total: req.length, done: d, all: fs.length, allDone: fs.filter(f => this.done(sid, f.id)).length, passed: d >= req.length};
  },
  nextTarget(sid){ const opt = this.optional(sid), fs = this.files(sid); return (fs.find(f => !opt.has(f.id) && !this.done(sid, f.id)) || fs.find(f => !this.done(sid, f.id)) || fs[0] || {}).id; },
  async open(sid, fid){
    let f = S.full[sid];
    if (!f || !S.mats[sid] || S.mats[sid].loading || S.mats[sid].error) {
      busy(true, 'Đang chuẩn bị lộ trình học…');
      try {
        if (!f) f = S.full[sid] = await get('sessionFull', {sid}, {timeout: 45000});
        await ensureMats(sid);
        Course.syncGate(sid);
      } catch (e) { busy(false); return err(e.message); }
      busy(false);
    }
    Modal.stack.slice().forEach(m => Modal.close(m));
    if (Quiz.A == null) Quiz.hide();
    if (!this.files(sid).length) return Quiz.intro(sid);
    Reader.open(sid, fid || this.nextTarget(sid), {course: true});
  },
  /** Cập nhật điều kiện mở bài KT ngay trên máy sau khi học xong 1 tài liệu */
  syncGate(sid){
    const f = S.full[sid]; if (!f || !f.quiz || !f.quiz.gate || !f.quiz.gate.required || f.quiz.gate.bypass || !S.mats[sid] || !S.mats[sid].files) return;
    delete f.quiz.gate.pending;
    const st = this.stats(sid), g = f.quiz.gate;
    g.total = st.total; g.done = st.done; g.passed = st.passed;
    g.missing = this.files(sid).filter(x => !this.optional(sid).has(x.id) && !this.done(sid, x.id)).map(x => ({id: x.id, name: x.name, path: x.path}));
    const q = f.quiz;
    if (g.passed && q.active && q.totalQuestions > 0 && (q.attempts < q.maxAttempts || q.inProgress)) { q.available = true; q.reason = ''; }
  },
  side(sid, curId){
    const fs = this.files(sid), opt = this.optional(sid), st = this.stats(sid), f = S.full[sid] || {}, q = f.quiz || {};
    const s = findS(sid) || (f.data || {});
    const gateOk = !this.required(sid) || st.passed;
    const quizState = !q.hasQuiz ? 'none' : q.passed ? 'done' : (q.active ? (gateOk ? 'open' : 'locked') : 'closed');
    let lastPath = null;
    const items = fs.map((x, i) => {
      const d = this.done(sid, x.id), o = opt.has(x.id);
      let head = '';
      if (x.path !== lastPath) { lastPath = x.path; if (x.path) head = `<div class="crs-fold">${ic('folder')}${esc(x.path)}</div>`; }
      return head + `<button class="crs-st ${d ? 'done' : ''} ${x.id === curId ? 'cur' : ''}" data-a="crsGo" data-sid="${esc(sid)}" data-fid="${esc(x.id)}">
        <i>${d ? ic('check') : i + 1}</i><span><b class="clamp2">${esc(x.name)}</b><small>${ftypeLabel(x.kind)}${o ? ' · Không bắt buộc' : ''}${!d && x.id === curId ? ' · Đang học' : ''}</small></span></button>`;
    }).join('');
    return `<div class="crs-h"><div class="lbl">Lộ trình tự học</div><b class="clamp2">${esc(s.topic || '')}</b>
        <div class="ruler ${st.passed ? 'ok' : ''}" style="margin-top:10px"><i style="width:${st.total ? Math.round(st.done / st.total * 100) : 100}%"></i></div>
        <div class="xs muted" style="margin-top:6px">Đã học ${st.done}/${st.total} tài liệu${st.all > st.total ? ' bắt buộc' : ''}</div></div>
      <div class="crs-list"><div class="crs-sec">1 · Học tài liệu</div>${items}
        <div class="crs-sec">2 · Bài kiểm tra</div>
        <button class="crs-st quiz ${quizState}" data-a="crsQuiz" data-sid="${esc(sid)}"><i>${quizState === 'done' ? ic('check') : quizState === 'locked' ? ic('lock') : ic('clip')}</i><span><b>Bài kiểm tra sau đào tạo</b><small>${quizState === 'none' ? 'Buổi này chưa có bài kiểm tra' : quizState === 'done' ? 'Đã đạt ' + (q.best ? q.best.percent + '%' : '') : quizState === 'locked' ? 'Mở khi học xong tài liệu' : quizState === 'closed' ? 'Trainer chưa mở bài' : q.totalQuestions + ' câu · ' + q.durationMin + ' phút · đạt từ ' + q.passScore + '%'}</small></span></button>
        <div class="crs-sec">3 · Chứng chỉ</div>
        <div class="crs-st crt ${s.myCert || (q.best && q.best.certUrl) ? 'done' : ''}"><i>${ic('award')}</i><span><b>Chứng chỉ hoàn thành</b><small>${s.myCert ? 'Đã cấp — xem ở mục Chứng chỉ' : 'Tự cấp và gửi email khi đạt'}</small></span></div>
      </div>`;
  },
  foot(sid){
    const st = Reader.st; if (!st) return '';
    const fs = this.files(sid), i = fs.findIndex(x => x.id === st.f.id);
    const d = this.done(sid, st.f.id) || st.completed, o = this.optional(sid).has(st.f.id);
    const last = i === fs.length - 1;
    const msg = d ? `<span class="crs-ok">${ic('check')}Đã hoàn thành tài liệu này</span>`
      : st.f.view === 'drive' ? `<span>Xem hết nội dung rồi bấm <b>Đã xem xong</b>${st.wait > 0 ? ` (mở sau ${st.wait} giây)` : ''}.</span>`
      : st.manual ? '<span>Xem xong trên Drive rồi bấm <b>Đã xem xong</b>.</span>'
      : st.total > 1 ? `<span>Đọc tới trang cuối để hoàn thành — đang ở trang ${st.maxPage}/${st.total}.</span>` : '<span>Đang mở tài liệu…</span>';
    const manualBtn = !d && (st.f.view === 'drive' || st.manual) ? `<button class="btn btn-soft" data-a="crsMark" ${st.wait > 0 ? 'disabled' : ''}>${ic('check')}Đã xem xong</button>` : '';
    return `<div class="crs-msg">${msg}</div>
      <button class="btn btn-line" data-a="crsPrev" ${i <= 0 ? 'disabled' : ''}>${ic('left')}Trước</button>
      ${manualBtn}
      <button class="btn ${last && d ? 'btn-go' : 'btn-primary'}" data-a="crsNext" ${d || o ? '' : 'disabled'}>${last ? 'Sang bài kiểm tra' : (!d && o ? 'Bỏ qua (không bắt buộc)' : 'Tiếp tục')}${ic('right')}</button>`;
  },
  refresh(){ const st = Reader.st; if (!st || !st.course) return; const sd = $('crsSide'), ft = $('crsFoot'); if (sd) sd.innerHTML = this.side(st.sid, st.f.id); if (ft) ft.innerHTML = this.foot(st.sid); },
  complete(){
    const st = Reader.st; if (!st || st.completed) return;
    st.completed = true; st.done = true;
    const m = S.mats[st.sid];
    if (m) m.myProgress = (m.myProgress || []).filter(x => x.fileId !== st.f.id).concat([{fileId: st.f.id, percent: 100, completed: true}]);
    this.syncGate(st.sid);
    Reader.track({open: 1, page: st.total || 1, total: st.total || 1, done: 1});
    const s = this.stats(st.sid);
    if (s.passed && this.required(st.sid)) toast('Bạn đã học xong tài liệu — bài kiểm tra đã mở!', 'ok');
    this.refresh();
  },
  step(dir){
    const st = Reader.st; if (!st) return;
    const fs = this.files(st.sid), i = fs.findIndex(x => x.id === st.f.id), j = i + dir;
    if (j >= fs.length) return this.quizStep(st.sid);
    if (j < 0) return;
    Reader.open(st.sid, fs[j].id, {course: true});
  },
  quizStep(sid){
    const f = S.full[sid] || {}, q = f.quiz || {}, st = this.stats(sid), s = findS(sid) || f.data || {};
    const gateOk = !this.required(sid) || st.passed;
    if (Reader.st) { Reader.st.onQuiz = true; }
    let body;
    if (!q.hasQuiz) body = `<div class="crs-card">${ic('check', 'big ok')}<h2 class="h-lg">Bạn đã học xong tài liệu</h2><p class="muted">Buổi đào tạo này chưa có bài kiểm tra. Khi trainer phát hành, bạn sẽ nhận thông báo 🔔 và email.</p><button class="btn btn-primary" data-a="rdClose">Về trang buổi đào tạo</button></div>`;
    else if (q.passed) body = `<div class="crs-card">${ic('award', 'big ok')}<h2 class="h-lg">Bạn đã hoàn thành khoá học</h2><p class="muted">Điểm cao nhất ${q.best ? q.best.percent + '%' : ''}. Chứng chỉ đã được gửi vào email của bạn.</p>${s.myCert ? `<a class="btn btn-primary" href="${esc(s.myCert)}" target="_blank" rel="noopener">${ic('award')}Xem chứng chỉ</a>` : ''}</div>`;
    else if (!gateOk) body = `<div class="crs-card">${ic('lock', 'big')}<h2 class="h-lg">Còn ${st.total - st.done} tài liệu cần học</h2><p class="muted">Học xong toàn bộ tài liệu bắt buộc để mở bài kiểm tra.</p>
        <div class="crs-miss">${this.files(sid).filter(x => !this.optional(sid).has(x.id) && !this.done(sid, x.id)).map(x => `<button class="resume" data-a="crsGo" data-sid="${esc(sid)}" data-fid="${esc(x.id)}">${ftype(x.kind)}<div class="t"><b class="clamp1">${esc(x.name)}</b><span>${esc(x.path || 'Tài liệu chính')}</span></div>${ic('right')}</button>`).join('')}</div></div>`;
    else if (!q.active) body = `<div class="crs-card">${ic('clock', 'big')}<h2 class="h-lg">Bài kiểm tra chưa mở</h2><p class="muted">Bạn đã học xong tài liệu. Khi trainer mở bài, bạn sẽ nhận thông báo 🔔 và email.</p><button class="btn btn-line" data-a="rdClose">Đóng</button></div>`;
    else if (!q.available) body = `<div class="crs-card">${ic('info', 'big')}<h2 class="h-lg">Chưa làm được bài kiểm tra</h2><p class="muted">${esc(q.reason || '')}</p><button class="btn btn-line" data-a="rdClose">Đóng</button></div>`;
    else body = `<div class="crs-card">${ic('check', 'big ok')}<h2 class="h-lg">Bạn đã học xong ${st.done}/${st.total} tài liệu</h2><p class="muted">Bước tiếp theo: bài kiểm tra ${q.totalQuestions} câu trong ${q.durationMin} phút, đạt từ ${q.passScore}% sẽ nhận chứng chỉ ngay.${q.deadline ? ' Hạn hoàn thành ' + dmy(q.deadline) + '.' : ''}</p>
        <div class="qfacts" style="justify-content:center;margin:6px 0 22px"><div><b>${q.totalQuestions}</b>câu hỏi</div><div><b>${q.durationMin}'</b>thời gian</div><div><b>${q.passScore}%</b>điểm đạt</div><div><b>${Math.max(0, q.maxAttempts - q.attempts)}</b>lượt còn lại</div></div>
        <button class="btn btn-go btn-lg" data-a="crsStartQuiz" data-sid="${esc(sid)}">${ic('play')}${q.inProgress ? 'Tiếp tục bài kiểm tra' : 'Làm bài kiểm tra ngay'}</button></div>`;
    $('rdBody').innerHTML = `<div class="crs-final">${body}</div>`;
    $('rdPgn') && $('rdPgn').classList.add('hide'); $('rdZoom') && $('rdZoom').classList.add('hide');
    const sd = $('crsSide'); if (sd) { sd.innerHTML = this.side(sid, ''); const qb = sd.querySelector('.crs-st.quiz'); if (qb) qb.classList.add('cur'); }
    const ft = $('crsFoot'); if (ft) ft.innerHTML = `<div class="crs-msg"></div><button class="btn btn-line" data-a="crsBack">${ic('left')}Quay lại tài liệu</button>`;
    const t = document.querySelector('#reader .rd-top .t span'); if (t) t.textContent = 'Bước 2 · Bài kiểm tra';
    const tb = document.querySelector('#reader .rd-top .t b'); if (tb) tb.textContent = s.topic || 'Bài kiểm tra';
    const ft2 = document.querySelector('#reader .rd-top .ftype'); if (ft2) ft2.style.display = 'none';
  }
};

/* ==========================================================================
   LÀM BÀI KIỂM TRA — toàn màn hình, 1 câu/trang, phím tắt, lưu nháp trên máy,
   tiếp tục được nếu lỡ tải lại trang, tự nộp khi hết giờ.
   ========================================================================== */
const Quiz = {
  A: null, timer: null,
  el(){ return $('qz'); },
  show(html){ const el = this.el(); el.innerHTML = html; el.classList.add('on'); document.body.style.overflow = 'hidden'; },
  hide(){ clearInterval(this.timer); this.el().classList.remove('on'); this.el().innerHTML = ''; this.A = null; if (!$('reader').classList.contains('on')) document.body.style.overflow = ''; },
  top(title, sub, right){ return `<div class="qz-top"><button class="ibtn" data-a="qzExit" aria-label="Thoát">${ic('x')}</button><div class="t"><b class="clamp1">${esc(title)}</b><span class="clamp1">${esc(sub || '')}</span></div>${right || ''}</div>`; },

  async intro(sid, fromCourse){
    const s = findS(sid) || {topic: ''};
    this.show(this.top(s.topic, 'Bài kiểm tra sau đào tạo') + `<div class="qz-main"><div class="qz-intro">${skel(4)}</div></div>`);
    let q;
    try {
      q = await get('myQuizStatus', {sid}, {fresh: true});
      if (q.gate && q.gate.pending) { await ensureMats(sid); q = await get('myQuizStatus', {sid}, {fresh: true}); }
    }
    catch (e) { return this.show(this.top(s.topic, '') + `<div class="qz-main"><div class="qz-intro">${errBox('Chưa tải được bài kiểm tra', e, `<button class="btn btn-primary" data-a="quiz" data-sid="${esc(sid)}">Thử lại</button>`)}</div></div>`); }
    if (!q.hasQuiz) return this.show(this.top(s.topic, '') + `<div class="qz-main"><div class="qz-intro">${emptyBox('clip', 'Buổi đào tạo này chưa có bài kiểm tra', '')}</div></div>`);
    const left = Math.max(0, q.maxAttempts - q.attempts);
    const can = q.available;
    const g = q.gate || {};
    const gateBox = g.required && !g.passed && !q.inProgress ? `<div class="gatebox">${ic('lock')}<div style="flex:1"><b>Hoàn thành tài liệu trước khi làm bài · ${g.done}/${g.total}</b>
        <div class="ruler" style="margin:8px 0 10px"><i style="width:${g.total ? Math.round(g.done / g.total * 100) : 0}%"></i></div>
        ${(g.missing || []).slice(0, 5).map(m => `<div class="xs" style="margin-top:3px">○ ${esc(m.name)}</div>`).join('')}${(g.missing || []).length > 5 ? `<div class="xs muted">… và ${g.missing.length - 5} tài liệu khác</div>` : ''}</div></div>` : '';

function audienceOptions(){

  const m = (S.meta.audiences || []).filter(a => !g.some(x => deacc(x.v) === deacc(a))).map(a => ({v: a, t: a, emails: []}));
  const p = S.users.map(u => ({v: u.name, t: u.name + (u.dept ? ' — ' + u.dept : ''), emails: [u.email]}));
  return {groups: g.concat(m), people: p};
}
function audienceCount(list){
  const o = audienceOptions(); const all = o.groups.concat(o.people); const set = new Set();
  list.forEach(v => { const hit = all.find(x => deacc(x.v) === deacc(v)); if (hit) hit.emails.forEach(e => set.add(pre(e))); else if (v.includes('@')) set.add(pre(v)); });

}

        <input class="inp" data-f="explanation" value="${esc(q.explanation || '')}" placeholder="Giải thích đáp án (hiện cho học viên sau khi nộp — không bắt buộc)" style="height:38px"></div>`;

    if ($('qcPass')) Object.assign(this.cfg, {passScore: nnum($('qcPass').value), durationMin: nnum($('qcDur').value), maxAttempts: nnum($('qcAtt').value), deadline: $('qcDl').value, note: $('qcNote').value.trim(), shuffle: $('qcShuf').checked, showResult: $('qcShow').checked, active: $('qcAct').checked, requireMaterials: $('qcReq').checked});

      const q = this.qs[i], n = 'Câu ' + (i + 1) + ': ';

      if (!q.correct) return n + 'chưa chọn đáp án đúng.';

        <textarea class="inp" id="pasteIn" rows="12" placeholder="Dán câu hỏi vào đây…" autofocus></textarea><div id="pasteOut" class="small" style="margin-top:10px"></div>`,

};
function parseQuestions(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  const out = []; let q = null;
  const push = () => { if (q && q.question) { if (!q.c && !q.d && q.type !== 'truefalse' && /^(đúng|dung|true)$/i.test(q.a) && /^(sai|false)$/i.test(q.b)) { q.type = 'truefalse'; q.correct = q.correct === 'A' || q.correct === 'B' ? q.correct : ''; } if (q.correct.length > 1) q.type = 'multi'; out.push(q); } };
  for (const ln of lines) {
    const mq = ln.match(/^(?:câu|cau|question|q)\s*(\d+)\s*[:.)\-]\s*(.*)$/i) || ln.match(/^(\d+)\s*[.)]\s+(.*)$/);
    const mo = ln.match(/^(\*)?\s*([A-Da-d])\s*[.)\-:]\s*(.+)$/);
    const ma = ln.match(/^(?:đáp án|dap an|đa|da|answer|ans|key)\s*(?:đúng)?\s*[:\-]\s*(.+)$/i);
    const me = ln.match(/^(?:giải thích|giai thich|explain|explanation|gt)\s*[:\-]\s*(.+)$/i);
    if (mq && !(mo && q && !q.b)) { push(); q = {qid: '', type: 'single', question: mq[2], a: '', b: '', c: '', d: '', correct: '', points: 1, explanation: ''}; continue; }
    if (!q) { q = {qid: '', type: 'single', question: ln, a: '', b: '', c: '', d: '', correct: '', points: 1, explanation: ''}; continue; }
    if (ma) {
      const v = ma[1].trim();
      if (/^(đúng|dung|true|t)$/i.test(v)) { q.type = 'truefalse'; q.correct = 'A'; }
      else if (/^(sai|false|f)$/i.test(v)) { q.type = 'truefalse'; q.correct = 'B'; }
      else q.correct = uniq(v.toUpperCase().replace(/[^ABCD]/g, '').split('')).sort().join('');
      continue;
    }
    if (me) { q.explanation = me[1]; continue; }
    if (mo) { const k = mo[2].toLowerCase(); q[k] = mo[3].trim(); if (mo[1]) q.correct = uniq((q.correct + k.toUpperCase()).split('')).sort().join(''); continue; }
    if (!q.a) q.question += (q.question ? '\n' : '') + ln;
  }
  push();
  return out;
}

    this.bind(); this.draw(); this.preview();

  setDefaultTo(only){
    const st = this.st;
    if (only) st.to = [only];
    else st.to = (st.kind === 'reminder' ? st.L.filter(l => !l.pass) : st.L).map(l => l.email);
  },
  bind(){
    const st = this.st;
    $('emKind').querySelectorAll('button').forEach(b => b.onclick = () => { st.kind = b.dataset.k; $('emKind').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); if (st.kind === 'reminder') st.to = st.L.filter(l => !l.pass).map(l => l.email); this.draw(); this.preview(); });

    $('emToAdd').addEventListener('change', addTo); $('emToAdd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTo(); } });
    $('emMe').onchange = e => { st.ccMe = e.target.checked; };

    ['emSubj', 'emNote', 'emDl'].forEach(id => $(id) && $(id).addEventListener('input', upd));
    $('emSend').onclick = () => this.send();
    $('emGmail').onclick = () => this.gmail();

  },
  draw(){
    const st = this.st;
    const nm = e => { const u = S.users.find(x => pre(x.email) === pre(e)); return u ? u.name : e; };
    const chips = (arr, id) => { $(id).innerHTML = arr.length ? arr.map((e, i) => `<span class="c" title="${esc(e)}">${esc(nm(e))}<button type="button" data-i="${i}">${ic('x').replace('<svg', '<svg style="width:12px;height:12px"')}</button></span>`).join('') : '<span class="faint small" style="padding:0 6px">Chưa có</span>';
      $(id).querySelectorAll('button').forEach(b => b.onclick = () => { arr.splice(+b.dataset.i, 1); this.draw(); if (id === 'emTo') this.preview(); }); };
    chips(st.to, 'emTo'); chips(st.cc, 'emCc');
    $('emToN').textContent = '· ' + st.to.length + ' người';
    if ($('emDlBox')) $('emDlBox').classList.toggle('hide', st.kind === 'pre');
  },
  params(){ const st = this.st; return {sid: st.sid, kind: st.kind, recipients: st.to, cc: st.cc, ccMe: st.ccMe ? 1 : 0, subject: st.subject, note: st.note, deadline: st.kind === 'pre' ? '' : st.deadline, appUrl: location.href.split('#')[0]}; },
  async preview(){
    const seq = (this.seq = (this.seq || 0) + 1);
    $('emPh').innerHTML = '<span class="spin" style="width:14px;height:14px;vertical-align:-2px"></span> Đang dựng bản xem trước…';
    try {
      const r = await post('previewInvite', this.params(), {timeout: 45000, retry: 1});
      if (seq !== this.seq || !$('emFrame')) return;
      this.last = r;
      $('emFrame').srcdoc = r.html;
      $('emPh').innerHTML = `<b style="color:var(--navy)">${esc(r.subject)}</b>${r.quota != null ? ` <span class="faint">· còn ${r.quota} email trong hạn mức hôm nay</span>` : ''}`;
    } catch (e) { if ($('emPh')) $('emPh').textContent = 'Không dựng được bản xem trước: ' + e.message; }
  },
  async send(){
    const st = this.st;
    if (!st.to.length) return err('Chưa có người nhận.');
    if (!await confirmBox('Gửi email?', `Gửi tới <b>${st.to.length} người</b>${st.cc.length || st.ccMe ? ' (kèm CC)' : ''} và tạo thông báo trong ứng dụng.`, 'Gửi')) return;
    $('emSend').disabled = true; busy(true, 'Đang gửi email…');
    try { const r = await post('sendInvite', this.params(), {timeout: 120000}); busy(false); Modal.close(this.m); ok(r.message); delete S.full[st.sid]; reload(); }
    catch (e) { busy(false); $('emSend').disabled = false; err(e.message); }
  },
  gmail(){
    if (!this.last) return err('Đợi bản xem trước tải xong.');
    const st = this.st;
    const cc = st.cc.concat(st.ccMe ? [] : []);
    const url = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(st.to.join(',')) + (cc.length ? '&cc=' + encodeURIComponent(cc.join(',')) : '') + '&su=' + encodeURIComponent(this.last.subject) + '&body=' + encodeURIComponent(this.last.text);
    window.open(url, '_blank', 'noopener');
    toast('Đã mở Gmail. Lưu ý: gửi theo cách này sẽ không tạo thông báo 🔔 trong Hub.', '', {label: 'Tạo thông báo', fn: async () => { try { const r = await post('announce', {sid: st.sid, type: st.kind === 'pre' ? 'invite' : st.kind === 'reminder' ? 'reminder' : 'quiz', recipients: st.to, title: this.last.subject.replace(/^\[MMH Training\]\s*/, ''), message: 'Từ ' + S.user.name}); ok(r.message); } catch (e) { err(e.message); } }});
  }
};

function downloadCSV(name, rows){
  const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

VIEWS.calendar = function(){
  setCrumb(TITLES.calendar);
  const d0 = new Date(S.cal.getFullYear(), S.cal.getMonth(), 1);
  const start = new Date(d0); start.setDate(1 - ((d0.getDay() + 6) % 7));
  const today = todayISO();
  const by = {};
  S.sessions.forEach(s => { if (s.date) (by[s.date] = by[s.date] || []).push(s); });
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoOf(d), out = d.getMonth() !== d0.getMonth();
    if (i === 35 && out) break;
    cells += `<div class="dc ${out ? 'out' : ''} ${iso === today ? 'today' : ''}"><div class="dn">${d.getDate()}</div>${(by[iso] || []).map(s => `<button class="ev ${s.status === 'Cancel' ? 'cancel' : ''}" style="--c:var(--c-${catKey(s.category)})" data-a="go" data-h="#/s/${esc(s.sid)}" title="${esc(s.topic)}">${s.timeFrom ? esc(s.timeFrom) + ' ' : ''}${esc(s.topic)}</button>`).join('')}</div>`;
  }
  const monthList = S.sessions.filter(s => s.date && s.date.slice(0, 7) === isoOf(d0).slice(0, 7)).sort((a, b) => a.date.localeCompare(b.date));
  $('view').innerHTML = `
    <div class="cal-head"><h2>Tháng ${d0.getMonth() + 1}, ${d0.getFullYear()}</h2><button class="ibtn" data-a="calNav" data-d="-1">${ic('left')}</button><button class="ibtn" data-a="calNav" data-d="1">${ic('right')}</button><button class="btn btn-line btn-sm" data-a="calNav" data-d="0">Hôm nay</button><div class="sp" style="flex:1"></div>
      <div class="lgd">${['Product', 'SOP', 'Compliance', 'Funtional skills'].map(c => `<span><i style="background:var(--c-${catKey(c)})"></i>${catLabel(c)}</span>`).join('')}</div></div>
    <div class="cal">${['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(x => `<div class="dh">${x}</div>`).join('')}${cells}</div>
    <section class="sec"><div class="sec-h"><h2>Trong tháng (${monthList.length})</h2></div><div class="panel"><div class="panel-b agenda">${monthList.length ? monthList.map(s => { const d = parseISO(s.date);
      return `<div class="it" data-a="go" data-h="#/s/${esc(s.sid)}"><div class="dblock ${s.date === today ? 'today' : ''}"><b>${d.getDate()}</b><span>${WDS[d.getDay()]}</span></div><div style="flex:1;min-width:0">${catTag(s.category)}<h4>${esc(s.topic)}</h4><div class="m">${s.timeFrom ? esc(s.timeFrom + (s.timeTo ? '–' + s.timeTo : '')) + ' · ' : ''}${esc(s.trainer)} · ${esc(s.audience)}</div></div>${statusChip(s.status)}</div>`; }).join('') : `<div class="empty" style="padding:24px">${ic('cal')}<b>Không có buổi đào tạo trong tháng</b></div>`}</div></div></section>`;
};

function cmdk(){
  const pages = NAV.filter(n => !n.g && allowed(n)).map(n => ({t: n.t, s: 'Trang', h: '#/' + n.id, i: n.ic}));
  const m = Modal.open({body: `<div style="position:relative">${ic('search', 'sico')}<input id="ckIn" placeholder="Tìm bài đào tạo, trainer, trang…" autocomplete="off" autofocus></div><div class="res" id="ckRes"></div>`, bodyStyle: 'padding:0'});
  m.el.classList.add('cmdk');
  let sel = 0, res = [];
  const draw = () => {
    const q = deacc($('ckIn').value.trim());
    const ses = S.sessions.filter(s => s.status !== 'Cancel' && (!q || deacc(s.topic + ' ' + s.trainer + ' ' + s.category + ' ' + s.audience).includes(q))).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 8)
      .map(s => ({t: s.topic, s: s.dateText + ' · ' + s.trainer, h: '#/s/' + s.sid, i: 'book'}));
    const pg = pages.filter(p => !q || deacc(p.t).includes(q));
    const todo = S.todo.filter(t => !q || deacc(t.topic).includes(q)).map(t => ({t: 'Làm bài: ' + t.topic, s: t.questionCount + ' câu · ' + t.durationMin + ' phút', h: '#/quiz/' + t.sid, i: 'play'}));
    res = todo.concat(ses, pg);
    sel = Math.min(sel, Math.max(0, res.length - 1));
    let html = '', grp = '';
    res.forEach((r, i) => { const g = r.h.startsWith('#/quiz') ? 'Cần làm' : r.h.startsWith('#/s/') ? 'Buổi đào tạo' : 'Trang'; if (g !== grp) { grp = g; html += `<div class="grp">${g}</div>`; } html += `<div class="r ${i === sel ? 'sel' : ''}" data-i="${i}">${ic(r.i)}<div style="min-width:0"><b class="clamp1">${esc(r.t)}</b><span>${esc(r.s)}</span></div></div>`; });
    $('ckRes').innerHTML = html || '<div class="empty" style="padding:24px">Không tìm thấy kết quả</div>';
    $('ckRes').querySelectorAll('.r').forEach(el => el.onclick = () => pick(+el.dataset.i));
  };
  const pick = i => { const r = res[i]; if (!r) return; Modal.close(m); go(r.h); };
  $('ckIn').addEventListener('input', () => { sel = 0; draw(); });
  $('ckIn').addEventListener('keydown', e => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } else if (e.key === 'Enter') pick(sel); else if (e.key === 'Escape') Modal.close(m); });
  draw();
}

  saveCfg: async () => { const cfg = {}; document.querySelectorAll('#cfgBox [data-k]').forEach(i => cfg[i.dataset.k] = i.dataset.b ? String(i.checked) : i.value); try { const r = await post('saveConfig', {config: cfg}); S.cfg = Object.assign(S.cfg, r.config); ok(r.message); renderShell(); } catch (e) { err(e.message); } },
  clearCache: async () => { try { ok((await post('clearCache', {})).message); boot(false); } catch (e) { err(e.message); } },
  showLogs: async () => { busy(true); try { const r = await get('getLogs', {}); busy(false); Modal.open({size: 'wide', title: 'Nhật ký hệ thống', sub: '300 dòng gần nhất', body: `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Thời gian</th><th>Mức</th><th>Chức năng</th><th>Nội dung</th></tr></thead><tbody>${r.data.map(l => `<tr><td class="small" style="white-space:nowrap">${esc(l.time)}</td><td><span class="chip ${l.level === 'ERROR' ? 'bad' : l.level === 'WARN' ? 'warn' : 'mute'}">${esc(l.level)}</span></td><td class="small">${esc(l.action)}</td><td class="small">${esc(l.message)}${l.detail ? `<div class="xs faint">${esc(l.detail)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>`}); } catch (e) { busy(false); err(e.message); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el, e);
});
const CH = {perSet: el => { S[el.dataset.s].period = el.value; redrawPer(el.dataset.s); }};
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
function redrawPer(k){ if (k === 'lib') VIEWS.library.draw(); else VIEWS.manage(); }
window.addEventListener('pagehide', () => { if (Reader.st) Reader.beacon(); });

/** Kiểm tra kết nối: thử nhiều đường gọi + máy chủ tự chạy thử từng chức năng */
async function netDiag(){
  const sid = S.route.name === 's' ? SessionPage.sid : '';
  const m = Modal.open({size: 'mid', title: 'Kiểm tra kết nối máy chủ', sub: 'Đang chạy thử — khoảng 10–40 giây…', body: `<div id="ndBox">${skel(3)}</div>`,
    foot: `<a class="btn btn-line" href="${esc(rawUrl('ping'))}" target="_blank" rel="noopener">${ic('ext')}Phản hồi gốc: ping</a>${sid ? `<a class="btn btn-line" href="${esc(rawUrl('sessionFull', {sid}))}" target="_blank" rel="noopener">${ic('ext')}Phản hồi gốc: buổi này</a>` : ''}<button class="btn btn-line" id="ndCopy">${ic('copy')}Sao chép</button><div class="sp"></div><button class="btn btn-primary" data-mclose>Đóng</button>`});
  const rows = [];
  const add = (t, okk, note) => { rows.push({t, ok: okk, note}); draw(); };
  const draw = () => { if ($('ndBox')) $('ndBox').innerHTML = rows.map(r => `<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start"><span class="chip ${r.ok === null ? 'mute' : r.ok ? 'ok' : 'bad'}" style="min-width:64px;justify-content:center">${r.ok === null ? '—' : r.ok ? 'Tốt' : 'Lỗi'}</span><div style="flex:1;min-width:0"><b style="color:var(--navy)">${esc(r.t)}</b><div class="small muted" style="word-break:break-word">${esc(r.note)}</div></div></div>`).join('') + (rows.verdict ? `<div class="msg ${rows.verdictOk ? 'ok' : 'err'}" style="margin-top:14px">${rows.verdict}</div>` : ''); };
  const timed = async (fn) => { const t = Date.now(); try { const r = await fn(); return {ok: true, r, ms: Date.now() - t}; } catch (e) { return {ok: false, e, ms: Date.now() - t}; } };
  const a = await timed(() => transport('ping', {}, false, 25000));
  add('Gọi máy chủ (GET)', a.ok, a.ok ? a.ms + ' ms · máy chủ v' + a.r.version : (a.e.message || 'lỗi') + ' · ' + a.ms + ' ms');
  const b = await timed(() => transport('ping', {}, true, 25000));
  add('Gọi máy chủ (POST)', b.ok, b.ok ? b.ms + ' ms' : (b.e.message || 'lỗi'));
  const c = await timed(() => jsonp({action: 'ping'}, 25000));
  add('Gọi máy chủ (JSONP)', c.ok, c.ok ? c.ms + ' ms' : (c.e.message || 'lỗi'));
  let page = false;
  if (!a.ok) { const d = await timed(() => fetch(API_URL + '?action=ping', {mode: 'no-cors', cache: 'no-store'})); page = d.ok; add('Máy chủ có phản hồi (không đọc nội dung)', d.ok, d.ok ? 'Có — nhưng là trang lỗi, không phải dữ liệu' : 'Không — chưa tới được máy chủ'); }
  const live = a.ok || b.ok || c.ok;
  let st = null, br = null;
  if (live) {
    const me = await timed(() => transport('me', {}, !a.ok && b.ok, 25000));
    add('Phiên đăng nhập', me.ok, me.ok ? me.ms + ' ms · ' + me.r.user.email : me.e.message);
    const t = await timed(() => transport('selfTest', {sid}, !a.ok && b.ok, 120000));
    if (t.ok) {
      st = t.r;
      st.results.forEach(x => add('Máy chủ tự chạy: ' + x.name, x.ok && x.ms < 20000, x.ms + ' ms · ' + (x.size / 1024).toFixed(1) + ' KB' + (x.oddChars ? ' · ' + x.oddChars + ' ký tự lạ' : '') + (x.error ? ' · LỖI: ' + x.error : '')));
      if (st.running && st.running.length) add('Lượt đang chạy dở trên máy chủ', !st.running.some(r => r.sec > 30), st.running.slice(0, 6).map(r => r.action + ' ' + r.sec + 's').join(' · '));
      add('Bộ nhớ Script Properties', st.properties.kb < 400, st.properties.count + ' khoá · ' + st.properties.kb + ' KB / 500 KB');
    } else add('Máy chủ tự chạy thử', false, t.e.message);
    if (sid) {
      br = await timed(() => transport('sessionFull', {sid}, false, 60000));
      add('Trình duyệt nhận "buổi đào tạo này" (GET)', br.ok, br.ok ? br.ms + ' ms' : (br.e.message || 'lỗi') + ' · ' + br.ms + ' ms');
      if (!br.ok) { const bp = await timed(() => transport('sessionFull', {sid}, true, 60000)); add('Trình duyệt nhận "buổi đào tạo này" (POST)', bp.ok, bp.ok ? bp.ms + ' ms' : (bp.e.message || 'lỗi')); if (bp.ok) br = bp; }
    }
  }
  const sf = st && st.results.find(x => x.name.includes('sessionFull'));
  rows.verdictOk = live && (!sid || (br && br.ok));
  if (!live && page) rows.verdict = '<b>Google đang trả trang lỗi cho mọi yêu cầu.</b> Bấm <b>Phản hồi gốc: ping</b> để xem nguyên văn. Thường gặp: (1) cần cấp quyền lại — Admin mở Apps Script, chạy hàm <b>kiemTraQuyen</b>, bấm Allow; (2) Deploy chưa tạo <b>New version</b> hoặc link /exec khác với link trong index.html; (3) code dán thiếu/lỗi cú pháp.';
  else if (!live) rows.verdict = '<b>Không tới được máy chủ Google.</b> Kiểm tra mạng / VPN / tường lửa công ty có chặn <b>script.google.com</b> và <b>script.googleusercontent.com</b>.';
  else if (sid && br && !br.ok && sf && sf.ok) rows.verdict = '<b>Máy chủ xử lý "buổi đào tạo này" bình thường (' + sf.ms + ' ms) nhưng trình duyệt không nhận được.</b> Lỗi nằm trên đường truyền: tường lửa/proxy công ty chặn nội dung, hoặc Google giới hạn tài khoản chạy script. Bấm <b>Phản hồi gốc: buổi này</b> để xem nguyên văn.';
  else if (sf && !sf.ok) rows.verdict = '<b>Máy chủ gặp lỗi khi xử lý buổi đào tạo này:</b> ' + esc(sf.error || 'quá chậm') + '. Chụp màn hình này gửi người phát triển.';
  else rows.verdict = 'Kết nối bình thường. Nếu vừa gặp lỗi, có thể Google tạm giới hạn khi tài khoản chạy script (mmh.product) đang bận với nhiều webapp khác — ứng dụng tự thử lại. Admin xem thêm ở Apps Script → <b>Executions</b>.';
  const sub = m.el.querySelector('.modal-h p'); if (sub) sub.textContent = 'Hoàn tất — ' + new Date().toLocaleTimeString('vi-VN');
  draw();
  $('ndCopy').onclick = () => { const t = 'MMH Training Hub v' + APP_VERSION + ' — kiểm tra kết nối ' + new Date().toLocaleString('vi-VN') + (sid ? ' — buổi ' + sid : '') + '\n' + rows.map(r => (r.ok === null ? '[—] ' : r.ok ? '[OK] ' : '[LỖI] ') + r.t + ': ' + r.note).join('\n') + '\n' + navigator.userAgent; navigator.clipboard.writeText(t).then(() => ok('Đã sao chép.'), () => err('Trình duyệt chặn sao chép.')); };
}

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (S.user) cmdk(); return; }
  if (e.key === 'Escape') {
    if (Modal.top()) { if (!Modal.top().lock) Modal.close(); return; }
    if ($('drawer').classList.contains('on')) return closeDrawer();
    if ($('reader').classList.contains('on')) return Reader.close();
    if ($('qz').classList.contains('on') && Quiz.A && (Quiz.A.done || Quiz.A.preview)) return A.qzDone();
    return;
  }
  if (typing || Modal.top()) return;
  if ($('qz').classList.contains('on') && Quiz.A && !Quiz.A.done && Quiz.A.idx !== 'review') {
    const q = Quiz.A.r.questions[Quiz.A.idx]; const k = e.key.toUpperCase();
    const map = {'1': 'A', '2': 'B', '3': 'C', '4': 'D'};
    const L = map[k] || k;
    if (q && q.options.some(o => o.k === L) && /^[A-D]$/.test(L)) { Quiz.pick(L); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { if (Quiz.A.idx < Quiz.A.r.questions.length - 1) Quiz.nav(1); else A.qzReview(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { Quiz.nav(-1); e.preventDefault(); }
    else if (k === 'F') A.qzFlag();
    return;
  }
  if ($('reader').classList.contains('on') && Reader.st && Reader.st.pdf) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { Reader.goto(Reader.st.page + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { Reader.goto(Reader.st.page - 1); e.preventDefault(); }
    else if (e.key === '+' || e.key === '=') Reader.zoom(1); else if (e.key === '-') Reader.zoom(-1);
    return;
  }
  if (e.key === '/' && S.user) { e.preventDefault(); cmdk(); }
});
