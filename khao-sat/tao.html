<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo khảo sát MMH</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; background:#fff; color:#1E2B36; font:15px/1.55 Aptos, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { max-width:640px; margin:24px auto; border:1px solid #BCD4E6; border-radius:10px; padding:22px; }
  h1 { font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#2C4A5E; margin:0 0 12px; }
  .btn { border:0; border-radius:8px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; background:#2C4A5E; color:#fff; }
  .btn[disabled] { opacity:.55; }
  .mut { color:#5E6E7C; } .err { color:#B3261E; }
  a { color:#2C4A5E; word-break:break-all; }
  dl { margin:14px 0 0; } dt { font-weight:600; color:#2C4A5E; margin-top:10px; } dd { margin:2px 0 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Tạo khảo sát MMH từ bản soạn của Claude</h1>
  <div id="sum" class="mut">Đang đọc bản soạn…</div>
  <p><button class="btn" id="go" disabled>Tạo khảo sát</button></p>
  <div id="out"></div>
</div>
<script>
/* Dự phòng khi phiên Claude không gọi được máy chủ survey (skill mmh-survey-quiz ▸ survey.py mmh-link). Link: tao.html#k=<khoá>&z=<spec gzip base64url>[&u=<mã cần sửa>].
   Phần sau dấu # không gửi lên máy chủ GitHub. */
var API = 'https://script.google.com/macros/s/AKfycbx8l7u4j2tFDpfsg8IFsEcuXNrTbrLVRA_SoZ2Iisqprfm1ipL4z2NfDudVKuI1paFQPg/exec';
var TK = (function () { try { var o = JSON.parse(localStorage.getItem('mmh_tk') || 'null'); return o && o.tk && (!o.exp || Date.now() < o.exp) ? o.tk : ''; } catch (e) { return ''; } })();
var H = new URLSearchParams(location.hash.replace(/^#/, '')), K = H.get('k') || '', Z = H.get('z') || '', U = H.get('u') || '';
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function unz(z) {
  var b = atob(z.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((z.length + 3) % 4)), u = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);
}
if (!K || !Z) $('sum').innerHTML = '<span class="err">Link thiếu bản soạn. Nhờ Claude gửi lại link.</span>';
else unz(Z).then(function (s) {
  var n = (s.sections || []).reduce(function (a, x) { return a + (x.questions || []).filter(function (q) { return q.t !== 'header'; }).length; }, 0);
  $('sum').innerHTML = '<b>' + esc(s.title) + '</b><br>' + n + ' câu · ' + (s.sections || []).length + ' phần · ' + esc(s.grp || '') +
    (s.event && s.event.name ? ' · ' + esc(s.event.name) : '') + (U ? '<br>Sửa khảo sát đã có (mã ' + esc(U) + ', giữ nguyên link)' : '');
  if (U) $('go').textContent = 'Cập nhật khảo sát';
  $('go').disabled = false;
}).catch(function (e) { $('sum').innerHTML = '<span class="err">Bản soạn lỗi (' + esc(e.message) + '). Nhờ Claude gửi lại link.</span>'; });
$('go').onclick = function () {
  $('go').disabled = true; $('go').textContent = 'Đang tạo…'; $('out').innerHTML = '';
  fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(U ? { action: 'nsUpdate', key: K, s: U, pz: Z } : { action: 'nsCreate', key: K, pz: Z, tk: TK }) })
    .then(function (r) { return r.text(); })
    .then(function (t) { var r; try { r = JSON.parse(t); } catch (e) { throw new Error('Máy chủ bận, vui lòng bấm lại.'); } if (!r.ok) throw new Error(r.error || 'Lỗi máy chủ'); return r; })
    .then(function (r) {
      $('go').textContent = 'Xong';
      var L = [['Link khảo sát (gửi bác sĩ)', r.url], r.app ? ['Thống kê, biểu đồ (app MMH Survey)', r.app] : null, r.sheetUrl ? ['Kết quả (Google Sheet)', r.sheetUrl] : null, r.folderUrl ? ['Thư mục trong Product Survey', r.folderUrl] : null].filter(Boolean);
      $('out').innerHTML = '<dl>' + L.map(function (x) { return '<dt>' + x[0] + '</dt><dd><a href="' + esc(x[1]) + '" target="_blank" rel="noopener">' + esc(x[1]) + '</a></dd>'; }).join('') + '</dl>' +
        (r.task ? '<p>Report Hub: đã tạo task <b>' + esc(r.task.no) + ' · ' + esc(r.task.name) + '</b>' + (r.task.key ? ' trong Key task "' + esc(r.task.key) + '"' : '') + '.</p>' : r.taskErr ? '<p class="err">Chưa tạo được task Report Hub: ' + esc(r.taskErr) + '</p>' : '') +
        (r.send ? '<p><a class="btn" style="text-decoration:none;display:inline-block" href="' + esc(r.send) + '">Xem QR và gửi email cho Marketing</a></p>' : '') +
        '<p class="mut">Mã khảo sát: <b>' + esc(r.code) + '</b>. Làm thử 1 lần trước khi gửi bác sĩ.</p>';
    })
    .catch(function (e) { $('go').disabled = false; $('go').textContent = U ? 'Cập nhật khảo sát' : 'Tạo khảo sát'; $('out').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
};
</script>
</body>
</html>
