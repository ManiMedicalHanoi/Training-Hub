<!DOCTYPE html>
<!-- Khảo sát MMH (hệ thống riêng, không dùng Google Form). Link: khao-sat/?s=<mã 7 ký tự>. Xem thử không cần máy chủ: ?demo=dental | ?demo=ophthalmic.
     Máy chủ: web app survey (kho riêng tư mmh-backend ▸ backends/survey/MMH_SurveyNative.gs) — nsMeta / nsSubmit, kết quả ghi vào Google Sheet.
     Trình tự: Giới thiệu ⇒ Đồng ý xử lý dữ liệu cá nhân ⇒ Họ tên · SĐT · Nơi công tác ⇒ Theo dõi page Facebook (MANI Dental / MANI Ophthalmic) ⇒ câu hỏi từng phần ⇒ Cảm ơn.
     Câu trả lời lưu trên máy (localStorage) tới khi gửi xong ⇒ mở Facebook rồi quay lại (kể cả khi trình duyệt tải lại trang) vẫn tiếp tục đúng chỗ. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khảo sát · Mani Medical Hanoi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="mani.png">
<style>
  :root { --ink:#2C4A5E; --steel:#5A84A6; --line:#BCD4E6; --line2:#E3ECF4; --soft:#F3F7FB; --cream:#FBE9B7; --fld:#B9C6D3; --mut:#5E6E7C; --txt:#1E2B36; --bad:#B3261E; --ok:#1F6B45; --fb:#1877F2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:#fff; color:var(--txt); font:16px/1.55 Aptos, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line2); }
  .top .in { max-width:720px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  .top img { height:26px; width:auto; display:block; }
  .top .co { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); font-weight:600; }
  .top .st { margin-left:auto; font-size:13px; color:var(--mut); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .prog { height:3px; background:var(--line2); }
  .prog b { display:block; height:100%; width:0; background:var(--steel); transition:width .25s; }
  .wrap { max-width:720px; margin:0 auto; padding:22px 18px 120px; }
  .eyebrow { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); font-weight:600; margin:0 0 6px; }
  h1 { font-size:24px; line-height:1.3; color:var(--ink); margin:0 0 12px; font-weight:700; }
  h2 { font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); margin:0 0 4px; font-weight:700; }
  .sub { color:var(--steel); font-size:15px; margin:0 0 16px; }
  .lead { white-space:pre-line; margin:0 0 16px; }
  .facts { display:flex; flex-wrap:wrap; gap:8px 22px; padding:12px 0; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); margin:14px 0 18px; font-size:14px; color:var(--ink); }
  .facts span b { font-weight:600; }
  .note { background:var(--cream); border-radius:8px; padding:12px 14px; font-size:14px; margin:16px 0; }
  .box { border:1px solid var(--line); border-radius:10px; padding:16px; margin:14px 0; }
  .box .lbl { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--steel); font-weight:600; padding-bottom:8px; margin-bottom:10px; border-bottom:1px solid var(--line2); }
  .pre { white-space:pre-line; font-size:14px; color:var(--txt); }
  .q { border:1px solid var(--line); border-radius:10px; padding:16px; margin:14px 0; scroll-margin-top:80px; }
  .q.miss { border-color:var(--bad); box-shadow:0 0 0 2px rgba(179,38,30,.08); }
  .q .n { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--steel); font-weight:600; margin-bottom:2px; }
  .q .t { font-weight:600; color:var(--ink); margin:0 0 4px; }
  .q .t i { color:var(--bad); font-style:normal; }
  .q .hp { color:var(--mut); font-size:14px; margin:0 0 8px; white-space:pre-line; }
  .q .er { color:var(--bad); font-size:13px; margin-top:6px; display:none; }
  .q.miss .er { display:block; }
  .hd { padding:14px 0 4px; }
  .hd .hp { color:var(--mut); font-size:14px; white-space:pre-line; margin:4px 0 0; }
  .opt { display:flex; gap:12px; align-items:flex-start; padding:11px 12px; border:1px solid var(--line2); border-radius:8px; margin:7px 0; cursor:pointer; background:#fff; }
  .opt:hover { border-color:var(--fld); }
  .opt input { margin:3px 0 0; width:18px; height:18px; accent-color:var(--ink); flex:none; }
  .opt.on { border-color:var(--ink); background:var(--soft); }
  .opt .ot { flex:1; min-width:0; }
  .opt .ot input[type=text] { margin-top:8px; }
  input[type=text], input[type=tel], textarea, select { width:100%; padding:11px 12px; border:1px solid var(--fld); border-radius:8px; font:inherit; color:var(--txt); background:#fff; }
  textarea { min-height:96px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(44,74,94,.12); }
  .scale { display:flex; gap:6px; flex-wrap:wrap; }
  .scale button { flex:1 1 0; min-width:40px; padding:11px 0; border:1px solid var(--fld); border-radius:8px; background:#fff; font:inherit; font-weight:600; color:var(--ink); cursor:pointer; }
  .scale button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .scl { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--mut); margin-top:6px; }
  .stars { display:flex; gap:4px; flex-wrap:wrap; }
  .stars button { background:none; border:0; padding:4px; cursor:pointer; line-height:0; }
  .stars svg path { fill:#fff; stroke:var(--fld); stroke-width:1.4; }
  .stars button.on svg path { fill:#E8B43A; stroke:#C9962A; }
  .grow { padding:10px 0; border-top:1px solid var(--line2); }
  .grow:first-of-type { border-top:0; }
  .grow .rl { font-size:15px; margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:8px 12px; border:1px solid var(--fld); border-radius:999px; background:#fff; font:inherit; font-size:14px; color:var(--txt); cursor:pointer; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  details.pv { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:14px 0 4px; font-size:14px; }
  details.pv summary { cursor:pointer; color:var(--ink); font-weight:600; }
  details.pv .pre { margin-top:8px; color:var(--mut); }
  .chk span { font-size:15px; }
  .chk { display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:8px; margin:10px 0; cursor:pointer; }
  .chk input { width:20px; height:20px; margin:2px 0 0; accent-color:var(--ink); flex:none; }
  .chk.req { border-color:var(--ink); }
  .chk.miss { border-color:var(--bad); }
  .fld { margin:14px 0; }
  .fld label { display:block; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .fld label i { color:var(--bad); font-style:normal; }
  .fld .er { color:var(--bad); font-size:13px; margin-top:4px; min-height:0; }
  .page { display:flex; gap:14px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:16px; margin:16px 0; }
  .page .ic { width:52px; height:52px; border-radius:50%; background:var(--fb); flex:none; display:flex; align-items:center; justify-content:center; }
  .page .nm { font-weight:700; color:var(--ink); font-size:17px; }
  .page .ln { color:var(--mut); font-size:14px; }
  ol.steps { margin:6px 0 16px; padding-left:20px; color:var(--txt); }
  ol.steps li { margin:4px 0; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:8px; padding:13px 22px; font:inherit; font-weight:600; cursor:pointer; background:var(--ink); color:#fff; text-decoration:none; }
  .btn.fb { background:var(--fb); width:100%; font-size:17px; padding:15px; }
  .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .btn.ghost { background:none; color:var(--ink); padding:13px 6px; }
  .btn[disabled] { opacity:.5; cursor:default; }
  .link { background:none; border:0; padding:8px 0; font:inherit; color:var(--steel); text-decoration:underline; cursor:pointer; }
  .back { margin-top:10px; text-align:center; }
  .foot { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line2); padding-bottom:env(safe-area-inset-bottom); }
  .foot .in { max-width:720px; margin:0 auto; padding:10px 18px; display:flex; gap:10px; align-items:center; }
  .foot .msg { flex:1; color:var(--bad); font-size:14px; min-width:0; }
  .foot .sp { flex:1; }
  .ok { text-align:center; padding-top:28px; }
  .ok .mk { width:64px; height:64px; border-radius:50%; border:2px solid var(--ok); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .ok p { color:var(--txt); }
  .small { font-size:13px; color:var(--mut); }
  .legal { font-size:12px; color:var(--mut); text-align:center; padding:28px 0 0; }
  .spin { width:28px; height:28px; border:3px solid var(--line2); border-top-color:var(--ink); border-radius:50%; animation:sp 1s linear infinite; margin:60px auto 12px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hide { display:none !important; }
  .hp-f { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  @media (max-width:520px) { h1 { font-size:21px; } .wrap { padding-top:16px; } .top .co { display:none; } .lead { font-size:15px; line-height:1.5; } .facts { margin:10px 0 12px; } }
  @media (max-width:380px) { body { font-size:15px; } h1 { font-size:20px; } .wrap { padding-left:14px; padding-right:14px; } .opt { padding:10px; } }
</style>
</head>
<body>
<div class="top"><div class="in"><img src="mani.png" alt="MANI"><span class="co">Mani Medical Hanoi</span><span class="st" id="st"></span></div><div class="prog"><b id="pg"></b></div></div>
<main class="wrap" id="main"><div class="spin"></div><p class="small" style="text-align:center">Đang mở khảo sát…</p></main>
<div class="foot hide" id="foot"><div class="in"><button class="btn ghost" id="bk" type="button">Quay lại</button><span class="msg" id="msg"></span><button class="btn" id="nx" type="button">Tiếp tục</button></div></div>
<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbx8l7u4j2tFDpfsg8IFsEcuXNrTbrLVRA_SoZ2Iisqprfm1ipL4z2NfDudVKuI1paFQPg/exec';
  var Q = new URLSearchParams(location.search), CODE = (Q.get('s') || '').trim(), DEMO = Q.get('demo') || '';
  var $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var FB_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21h2.9z"/></svg>';
  var STAR = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
  var OK_SVG = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#1F6B45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.2 4.2L19 7"/></svg>';
  var SV = null, TOKEN = '', KEY = 'mmh_ks_' + (CODE || 'demo-' + DEMO), S = null, SENDING = false;

  /* ---------- trạng thái lưu trên máy ---------- */
  function fresh() { return { step: 'cover', hist: [], consent: { agree: false, opt: [] }, info: {}, follow: { st: '', at: 0, back: 0 }, A: {}, at: Date.now() }; }
  function load() { try { var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && Date.now() - (o.at || 0) < 7 * 864e5) return o; } catch (e) {} return fresh(); }
  function save() { S.at = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function doneInfo() { try { return JSON.parse(localStorage.getItem(KEY + ':done') || 'null'); } catch (e) { return null; } }

  /* ---------- các bước ---------- */
  function secIdx(id) { for (var i = 0; i < SV.sections.length; i++) if (SV.sections[i].id === id) return i; return -1; }
  function nextOf(si) {
    var s = SV.sections[si], nx = null;
    s.questions.forEach(function (q) {
      if ((q.t !== 'radio' && q.t !== 'list') || S.A[q.id] == null) return;
      (q.options || []).forEach(function (o) { if (o.go && o.go !== 'next' && o.v === S.A[q.id]) nx = o.go; });
    });
    nx = nx || s.go || 'next';
    if (nx === 'submit') return 'submit';
    var k = nx === 'next' ? si + 1 : secIdx(nx);
    return k >= 0 && k < SV.sections.length ? 's' + k : 'submit';
  }
  function pathSecs() {  // các phần sẽ đi qua theo câu trả lời hiện tại (để đếm tiến độ + chỉ gửi câu của các phần này)
    var out = [], st = 's0', g = 0;
    while (st !== 'submit' && g++ < 200) { var k = +st.slice(1); if (out.indexOf(k) >= 0) break; out.push(k); st = nextOf(k); }
    return out;
  }
  function stepsAll() { var a = ['cover', 'info']; return a.concat(pathSecs().map(function (k) { return 's' + k; })); }
  function go(step, push) {
    if (push !== false && S.step !== step) S.hist.push(S.step);
    S.step = step; save(); render(); window.scrollTo(0, 0);
  }
  function back() { if (!S.hist.length) return; S.step = S.hist.pop(); save(); render(); window.scrollTo(0, 0); }

  /* ---------- vẽ ---------- */
  function setProg() {
    var all = stepsAll(), i = all.indexOf(S.step), n = all.length;
    $('pg').style.width = S.step === 'cover' ? '0' : S.step === 'done' ? '100%' : Math.round(((i < 0 ? 0 : i) + 0.5) / n * 100) + '%';
    $('st').textContent = S.step === 'cover' || S.step === 'done' || i < 0 ? '' : 'Bước ' + (i + 1) + ' / ' + n;
  }
  function foot(show, nextLabel, canBack) {
    $('foot').classList.toggle('hide', !show); $('msg').textContent = '';
    if (!show) return;
    $('nx').classList.remove('hide');
    $('nx').textContent = nextLabel || 'Tiếp tục'; $('nx').disabled = false;
    $('bk').style.visibility = canBack === false || !S.hist.length ? 'hidden' : 'visible';
  }
  function render() {
    setProg();
    var m = $('main'), st = S.step;
    if (st === 'cover') return cover(m);
    if (st === 'consent') { S.step = 'cover'; return cover(m); }
    if (st === 'info') return info(m);
    if (st === 'follow') { S.step = 's0'; return render(); }   // bước theo dõi page nay ở trang cảm ơn (người dùng yêu cầu 18/11/2026)
    if (st === 'done') return done(m);
    if (/^s\d+$/.test(st)) return section(m, +st.slice(1));
    S.step = 'cover'; render();
  }
  function cover(m) {
    var nq = SV.nq || 0, ev = SV.event && SV.event.name ? SV.event.name + (SV.event.date ? ' · ' + SV.event.date.split('-').reverse().join('/') : '') : '', c = SV.consent;
    if (SV.open === false) {
      m.innerHTML = '<h1>' + esc(SV.title) + '</h1><div class="note">Khảo sát đã đóng. Cảm ơn Quý bác sĩ đã quan tâm.</div>'; foot(false); return;
    }
    m.innerHTML = '<p class="eyebrow">Khảo sát dành cho Quý bác sĩ' + (SV.grp === 'Dental' ? ' nha khoa' : SV.grp === 'Surgical' ? ' nhãn khoa' : '') + '</p>' +
      '<h1>' + esc(SV.title) + '</h1>' + (SV.intro ? '<p class="lead">' + esc(SV.intro) + '</p>' : '') +
      '<div class="facts">' + (nq ? '<span><b>' + nq + '</b> câu hỏi</span>' : '') + (SV.minutes ? '<span>Khoảng <b>' + SV.minutes + ' phút</b></span>' : '') +
      (ev ? '<span>' + esc(ev) + '</span>' : '') + '</div>' +
      '<details class="pv"><summary>' + esc(c.title.charAt(0) + c.title.slice(1).toLowerCase()) + '</summary><div class="pre">' + esc(c.text) + '</div></details>' +
      '<label class="chk req" id="c-ag"><input type="checkbox" id="c0"' + (S.consent.agree ? ' checked' : '') + '><span>' + esc(c.agree.v) + ' <span style="color:var(--bad)">*</span></span></label>' +
      (c.optional || []).map(function (o, i) { return '<label class="chk"><input type="checkbox" data-o="' + i + '"' + (S.consent.opt[i] ? ' checked' : '') + '><span>' + esc(o.v) + '</span></label>'; }).join('') +
      '<p class="legal">Công ty TNHH Mani Medical Hà Nội</p>';
    $('c0').onchange = function () { S.consent.agree = this.checked; $('c-ag').classList.remove('miss'); $('msg').textContent = ''; save(); };
    m.querySelectorAll('[data-o]').forEach(function (x) { x.onchange = function () { S.consent.opt[+x.dataset.o] = x.checked; save(); }; });
    foot(true, 'Bắt đầu', false);
  }
  function info(m) {
    m.innerHTML = '<p class="eyebrow">Thông tin liên hệ</p><h1>Thông tin của Quý bác sĩ</h1><p class="sub">Dùng để tổng hợp kết quả và liên hệ khi cần.</p>' +
      SV.info.map(function (x) {
        var v = S.info[x.id] || '', r = x.required ? ' <i>*</i>' : '', inp;
        if (x.t === 'radio' || x.t === 'list') inp = '<select id="f-' + esc(x.id) + '"><option value="">— Chọn —</option>' + x.options.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
        else inp = '<input id="f-' + esc(x.id) + '" type="' + (x.t === 'phone' ? 'tel' : 'text') + '" value="' + esc(v) + '"' + (x.t === 'phone' ? ' inputmode="tel" autocomplete="tel" placeholder="Ví dụ 0912 345 678"' : x.id === 'name' ? ' autocomplete="name"' : x.id === 'work' ? ' autocomplete="organization"' : '') + '>';
        return '<div class="fld"><label for="f-' + esc(x.id) + '">' + esc(x.q) + r + '</label>' + (x.help ? '<div class="small">' + esc(x.help) + '</div>' : '') + inp + '<div class="er" id="e-' + esc(x.id) + '"></div></div>';
      }).join('') + '<div class="hp-f" aria-hidden="true"><input id="hpf" tabindex="-1" autocomplete="off"></div>';
    SV.info.forEach(function (x, i) {
      var el = $('f-' + x.id); el.oninput = el.onchange = function () { S.info[x.id] = el.value; $('e-' + x.id).textContent = ''; save(); };
      if (el.tagName === 'INPUT') {
        el.setAttribute('enterkeyhint', i < SV.info.length - 1 ? 'next' : 'done');
        el.onkeydown = function (e) { if (e.key !== 'Enter') return; e.preventDefault(); var nx = SV.info[i + 1] && $('f-' + SV.info[i + 1].id); if (nx) nx.focus(); else { el.blur(); next(); } };
      }
    });
    foot(true, 'Tiếp tục');
  }
  function phoneOk(v) { var d = String(v || '').replace(/[\s.\-()]/g, ''); if (/^\+?84\d{9}$/.test(d)) d = '0' + d.replace(/^\+?84/, ''); return /^0\d{9}$/.test(d) || /^\+\d{8,15}$/.test(d); }

  /* ---------- theo dõi page Facebook ---------- */
  function fbHref() {
    var u = SV.page.url, ua = navigator.userAgent || '';
    if (/Android/i.test(ua) && /Zalo|Line\/|Instagram|TikTok|; wv\)/i.test(ua) && !/FBAN|FBAV/.test(ua))  // trình duyệt trong app (Zalo…) trên Android ⇒ mở thẳng app Facebook
      return 'intent://' + u.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.facebook.katana;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
    return u;
  }
  function pageCard(p) { return '<div class="page"><div class="ic">' + FB_SVG + '</div><div><div class="nm">' + esc(p.name) + '</div><div class="ln">' + esc(p.line) + '</div></div></div>'; }
  function firstSec() { return 's0'; }
  /* ---------- theo dõi page ở trang cảm ơn: bấm mở Facebook ⇒ quay lại (ẩn ≥ 3 giây) ⇒ ghi nhận đã theo dõi (nsFollow) ---------- */
  function saveDone(d) { try { localStorage.setItem(KEY + ':done', JSON.stringify(d)); } catch (e) {} }
  function fol() { var d = doneInfo() || {}; d.fol = d.fol || {}; return d; }
  function folMark(st) {
    var d = fol(); d.fol.st = st; d.fol.at = Date.now(); saveDone(d); render();
    if (DEMO || !d.rid) return;
    (function send(n) {
      post({ action: 'nsFollow', s: CODE, token: TOKEN, rid: d.rid, st: st, at: d.fol.at }).then(function (r) {
